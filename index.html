<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bonjour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&display=swap" rel="stylesheet">
    <style>
      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        box-sizing: border-box;
        place-items: center;
        background:
          radial-gradient(ellipse at 15% 15%, #fff8eb 0, transparent 32%),
          radial-gradient(ellipse at 85% 85%, #fbefdc 0, transparent 30%),
          linear-gradient(135deg, #f3e5d0, #ead7bd);
      }
      main {
        position: relative;
        box-sizing: border-box;
        width: min(100%, 36rem);
        padding: clamp(2rem, 7vw, 3.5rem);
        text-align: center;
        color: #57352f;
        background: #fff8eb;
        border: 2px solid #c62828;
        border-radius: 1.5rem;
        box-shadow:
          inset 0 0 0 7px rgb(198 40 40 / 8%),
          0 0 0 8px rgb(198 40 40 / 8%),
          0 24px 60px rgb(87 53 47 / 22%);
      }
      main::before {
        position: absolute;
        inset: 12px;
        border: 1px solid rgb(198 40 40 / 32%);
        border-radius: 1rem;
        content: "";
        pointer-events: none;
      }
      .ornament {
        position: absolute;
        color: #c62828;
        font-family: Georgia, serif;
        font-size: 1.7rem;
        line-height: 1;
        pointer-events: none;
      }
      .ornament--top-left {
        top: 0.4rem;
        left: 0.5rem;
      }
      .ornament--top-right {
        top: 0.4rem;
        right: 0.5rem;
        transform: rotate(90deg);
      }
      .ornament--bottom-right {
        right: 0.5rem;
        bottom: 0.4rem;
        transform: rotate(180deg);
      }
      .ornament--bottom-left {
        bottom: 0.4rem;
        left: 0.5rem;
        transform: rotate(270deg);
      }
      h1 {
        margin: 0;
        font-family: "Alex Brush", cursive;
        font-size: clamp(3.5rem, 10vw, 5rem);
        font-weight: 400;
        letter-spacing: 0.04em;
        line-height: 1.1;
        color: #c62828;
        text-shadow: 0 2px 0 rgb(198 40 40 / 10%);
      }
      h1::after {
        display: block;
        width: 4rem;
        height: 2px;
        margin: 0.75rem auto 1.5rem;
        background: #c62828;
        content: "";
      }
      p {
        margin: 0 0 1.75rem;
        line-height: 1.6;
      }
      form {
        display: flex;
        width: 100%;
        max-width: 26rem;
        margin: 0 auto;
        justify-content: center;
        gap: 0.65rem;
      }
      label {
        display: block;
        margin-bottom: 0.65rem;
        color: #8a3028;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        min-width: 0;
        flex: 1;
        padding: 0.8rem 1rem;
        color: #57352f;
        background: #fbefdc;
        border: 1px solid #c8977a;
        border-radius: 0.75rem;
        font: inherit;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }
      button {
        padding: 0.8rem 1.2rem;
        color: white;
        background: #c62828;
        border: 0;
        border-radius: 0.75rem;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease;
      }
      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 14px rgb(198 40 40 / 24%);
      }
      input:focus-visible,
      button:focus-visible {
        outline: 3px solid #c62828;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        input,
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="ornament ornament--top-left" aria-hidden="true">❧</span>
      <span class="ornament ornament--top-right" aria-hidden="true">❧</span>
      <span class="ornament ornament--bottom-right" aria-hidden="true">❧</span>
      <span class="ornament ornament--bottom-left" aria-hidden="true">❧</span>
      <h1>Bonjour</h1>
      <p>La page est servie par votre serveur Node.js.</p>
      <label for="code">Votre code</label>
      <form action="/code" method="post">
        <input id="code" name="code" type="text" autocomplete="off" placeholder="Saisissez votre code" required>
        <button type="submit">Entrer</button>
      </form>
    </main>
  </body>
</html>
